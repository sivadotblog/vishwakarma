# Virtual uv workspace root: holds shared dev tooling, no package of its own.
[tool.uv.workspace]
members = ["apps/api", "packages/vk"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Activates the uv venv before importing VK, so its later imports cannot sit at the top.
"packages/vk/prefect_flows/flows.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["api", "vk"]

[tool.mypy]
strict = true
files = [
    "apps/api/src",
    "apps/api/tests",
    "packages/vk/src",
    "packages/vk/tests",
    "packages/vk/prefect_flows",
]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "packages/vk/tests"]
pythonpath = ["packages/vk"]
