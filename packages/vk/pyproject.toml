[project]
name = "vk"
version = "0.1.0"
description = "Autonomous issue -> PR -> review-fix software factory on PydanticAI"
readme = "README.md"
authors = [{ name = "sivadotblog", email = "sivanandha@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai-harness>=0.59.0",
    "pydantic-ai-slim[anthropic,google]>=2.57.0",
    "requests",
]

[project.scripts]
vk = "vk.cli:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "prefect>=3.9.0",
    "types-requests>=2.33.0.20261006",
]
