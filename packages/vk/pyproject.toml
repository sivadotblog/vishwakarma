[project]
name = "vk"
version = "0.1.0"
description = "Autonomous issue -> PR -> review-fix software factory, any LLM via LiteLLM"
readme = "README.md"
authors = [{ name = "sivadotblog", email = "sivanandha@gmail.com" }]
requires-python = ">=3.12"
dependencies = ["litellm", "requests"]

[project.scripts]
vk = "vk.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "types-requests>=2.33.0.20261006",
]
