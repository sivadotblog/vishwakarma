# Deployments for the VK flows on the managed vk-agents pool. Deployed by
# .github/workflows/prefect-deploy.yml, which sets VK_BRANCH (the branch to pull) and
# VK_DEPLOYMENT (the branch slug, used as the deployment name) from the triggering ref.
name: vk
prefect-version: ">=3.8.8,<4"

# Run in the managed container before each flow run. The branch is resolved at run time from the
# VK_BRANCH baked into each deployment's job env below. The shell step installs what VK's agents
# need for `make check` (make, Node 22, uv) and runs `uv sync` with the worker's own Python;
# flows.py then activates that venv in-process to import VK. uv, never pip (AGENTS.md).
pull:
  - prefect.deployments.steps.git_clone:
      id: clone-step
      repository: https://github.com/sivadotblog/vishwakarma
      branch: "{{ $VK_BRANCH }}"
  - prefect.deployments.steps.run_shell_script:
      directory: "{{ clone-step.directory }}"
      shell: true
      stream_output: true
      script: |
        command -v make && command -v node || { apt-get update && apt-get install -y make curl ca-certificates && curl -fsSL https://deb.nodesource.com/setup_22.x | bash - && apt-get install -y nodejs; }
        command -v uv || [ -x "$HOME/.local/bin/uv" ] || curl -LsSf https://astral.sh/uv/0.12.1/install.sh | sh
        PATH="$HOME/.local/bin:$PATH" uv sync --locked --python "$(command -v python)"

definitions:
  work_pool: &vk-agents
    name: vk-agents
    job_variables:
      env:
        VK_BRANCH: "{{ $VK_BRANCH }}"
        PREFECT_LOGGING_EXTRA_LOGGERS: vk

deployments:
  - name: "{{ $VK_DEPLOYMENT }}"
    entrypoint: packages/vk/prefect_flows/flows.py:vk_issue
    work_pool: *vk-agents
  - name: "{{ $VK_DEPLOYMENT }}"
    entrypoint: packages/vk/prefect_flows/flows.py:vk_review
    work_pool: *vk-agents
