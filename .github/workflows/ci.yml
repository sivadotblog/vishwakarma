name: CI

# PRs only: main changes land through PRs, which already ran these checks.
on:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.1
      - run: make setup-python
      - run: make check-python

  web:
    name: Web (prettier, astro check, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: make setup-web
      - run: make check-web
